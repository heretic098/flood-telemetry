# Dependabot Configuration: Continuous Vulnerability Remediation (Security Only)
#
# IMPORTANT OPERATIONAL POLICY:
# Routine scheduled version bump PRs are completely disabled by setting
# open-pull-requests-limit to 0. This eliminates weekly/monthly version bump PR spam
# while preserving automated emergency patch PRs generated by GitHub Dependabot
# Security Advisories whenever known CVEs or KEVs (Known Exploited Vulnerabilities)
# affect dependencies.
#
# Reference: GitHub Dependabot v2 Specification (Disabling version updates while keeping security updates)

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
