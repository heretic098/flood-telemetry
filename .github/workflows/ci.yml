name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Container Build
        run: docker build -t somerset-flood-dashboard:ci-test .
