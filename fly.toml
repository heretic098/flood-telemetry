# fly.toml app configuration file generated for somerset-flood-dashboard on 2026-09-08T09:52:10+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'somerset-flood-dashboard'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate' # Enforces single-writer deployment to prevent split-brain WAL replication

# NOTE: Single-writer SQLite architecture. Do NOT scale beyond 1 machine (min_machines_running = 1).
[env]
  PORT = '8080'
  DB_PATH = '/data/telemetry.db'
  LITESTREAM_ENDPOINT = 'https://fly.storage.tigris.dev'
  AWS_REGION = 'auto'

[mounts]
  source = 'somerset_telemetry_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '60s'
    interval = '15s'
    method = 'get'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

