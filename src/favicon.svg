<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .wave-top { stroke: #38bdf8; }
      .wave-mid { stroke: #0284c7; }
      .pulse-dot { fill: #22c55e; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f8fafc; }
        .wave-top { stroke: #0284c7; }
        .wave-mid { stroke: #0369a1; }
        .pulse-dot { fill: #16a34a; }
      }
    </style>
  </defs>
  <rect width="32" height="32" rx="7" class="bg" />
  <!-- Telemetry Beacon Pulse -->
  <circle cx="16" cy="7.5" r="2.2" class="pulse-dot" />
  <!-- Dynamic Hydraulic Channel Waves -->
  <path d="M5 15 C9 12.5, 13 12.5, 16 15 C19 17.5, 23 17.5, 27 15" fill="none" class="wave-top" stroke-width="2.5" stroke-linecap="round" />
  <path d="M5 21 C9 18.5, 13 18.5, 16 21 C19 23.5, 23 23.5, 27 21" fill="none" class="wave-mid" stroke-width="2.5" stroke-linecap="round" />
  <path d="M5 26.5 C9 24.5, 13 24.5, 16 26.5 C19 28.5, 23 28.5, 27 26.5" fill="none" class="wave-top" stroke-width="1.7" stroke-linecap="round" opacity="0.6" />
</svg>
