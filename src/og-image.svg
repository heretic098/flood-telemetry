<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Hydraulic Background Grid Lines -->
  <g stroke="rgba(56, 189, 248, 0.07)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Flow Wave Water Currents in Background -->
  <path d="M0 450 C300 410, 600 490, 900 440 C1050 415, 1150 435, 1200 450 L1200 630 L0 630 Z" fill="rgba(2, 132, 199, 0.12)" />
  <path d="M0 480 C350 450, 700 520, 1000 470 C1100 455, 1170 475, 1200 480 L1200 630 L0 630 Z" fill="rgba(56, 189, 248, 0.08)" />

  <!-- Main Content Card Container -->
  <rect x="80" y="70" width="1040" height="490" rx="20" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />

  <!-- Live Telemetry Pill Beacon -->
  <g transform="translate(130, 125)">
    <rect width="260" height="42" rx="21" fill="rgba(34, 197, 94, 0.15)" stroke="#22c55e" stroke-width="1.5" />
    <circle cx="26" cy="21" r="7" fill="#22c55e" filter="url(#glow)" />
    <text x="45" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#4ade80" letter-spacing="1.5">LIVE TELEMETRY STREAM</text>
  </g>

  <!-- Title -->
  <text x="130" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Somerset Levels Flood Status
  </text>

  <!-- Subtitle -->
  <text x="130" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">
    Real-Time River Levels, Highway Passability &amp; Lowland Moor Storage
  </text>

  <!-- Infrastructure Pillars Badges -->
  <g transform="translate(130, 360)">
    <!-- Pill 1: Roads -->
    <rect x="0" y="0" width="210" height="48" rx="10" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#38bdf8">🚗 8 Road Corridors</text>

    <!-- Pill 2: Spillways -->
    <rect x="230" y="0" width="220" height="48" rx="10" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="250" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#38bdf8">🌊 Spillways &amp; Clyses</text>

    <!-- Pill 3: Polders -->
    <rect x="470" y="0" width="220" height="48" rx="10" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="490" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#38bdf8">🌾 Moor Basins</text>

    <!-- Pill 4: Topology -->
    <rect x="710" y="0" width="220" height="48" rx="10" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="730" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#38bdf8">🗺️ River Topology</text>
  </g>

  <!-- Bottom Provenance Footer -->
  <line x1="130" y1="460" x2="1070" y2="460" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
  <text x="130" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#64748b">
    📡 UK Environment Agency Open Telemetry (OGL v3.0) • Apache-2.0 Open Source Platform
  </text>
</svg>
